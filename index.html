<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>МОЯК</title>
<style>
:root{--bg:#eaf6ff;--fg:#0e2a47;--card:#fff;--line:#b7dbf1;--blue:#1f78bf;--tile:#3194dd;--gold:#9bd5fb;--mut:#4f7595;--ok:#1f9d55;--bad:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f3faff,#d9edfc) fixed;color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font:800 clamp(28px,6vw,44px) Georgia,serif;letter-spacing:.04em;text-align:center;color:var(--blue);text-shadow:0 2px 0 #fff,0 6px 16px rgba(31,120,191,.3);margin:8px 0 18px;animation:zoom .7s cubic-bezier(.2,1.3,.4,1)}
h2{font:700 24px Georgia,serif;margin:0 0 6px}
label{display:block;font-weight:600;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--blue);color:#fff;font-weight:600;transition:transform .12s,opacity .2s,filter .2s}
button:not(:disabled):active{transform:scale(.95)}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}button.gold{background:var(--gold);color:#222}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
.mut{color:var(--mut);font-size:14px}.err{color:var(--bad);font-weight:600}
.grid{display:grid;gap:6px;margin:10px 0}
.cat{background:var(--blue);color:#fff;font-weight:700;text-align:center;padding:10px 4px;border-radius:8px;font-size:clamp(11px,2.4vw,16px);text-transform:uppercase;display:flex;align-items:center;justify-content:center;min-height:52px;overflow-wrap:anywhere}
.tile{background:var(--tile);color:#fff;font:800 clamp(18px,4.5vw,34px) Georgia,serif;padding:0 2px;border-radius:8px}
.tile:disabled{opacity:1;cursor:default}
.tile:not(:disabled):hover{transform:scale(1.06);box-shadow:0 4px 14px rgba(31,120,191,.45)}
.tile.used{background:transparent;border:1px dashed var(--line);color:transparent}
.score{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600}
.chip b{color:var(--blue)}
.code{font:800 26px ui-monospace,monospace;letter-spacing:.2em;color:#fff;background:var(--blue);padding:4px 14px;border-radius:10px}
.ov{position:fixed;inset:0;background:rgba(12,56,104,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.ov .box{background:var(--tile);color:#fff;border-radius:16px;padding:24px;max-width:720px;width:100%;text-align:center}
.q{font:700 clamp(20px,5vw,32px) Georgia,serif;margin:14px 0}
.ans{background:#fff;color:#14183a;border-radius:10px;padding:10px;font-weight:700;margin:10px 0}
.hostans{font-size:14px;opacity:.85}
.buzz{font-size:28px;padding:22px 40px;background:#fff;color:var(--blue);min-width:200px}
.buzz:not(:disabled){animation:pulse 1.6s infinite}
.buzz:disabled{filter:grayscale(1);opacity:.3;cursor:not-allowed}
.ed{border-left:4px solid var(--blue);padding-left:10px;margin:10px 0}
.ed .r{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}.ed .r>b{width:54px}.ed .r>input{flex:1 1 140px;width:auto}
.imc{display:flex;gap:6px;align-items:center}.th{height:40px;border-radius:6px}.imb{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.imc button{padding:8px 10px}.eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}.eq>*{width:100%;min-height:48px}.eq.tabs{grid-template-columns:repeat(3,1fr)}
.stack{display:grid;gap:10px}.stack>*{width:100%;min-height:48px}
.top{display:flex;align-items:center;gap:8px}.top .code{font-size:20px;padding:2px 10px;white-space:nowrap}.top button{margin-left:auto;padding:6px 12px;font-size:14px}
body.g h1{display:none}
body.g main{max-width:1200px;padding:8px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
body.g #app{flex:1;display:flex;flex-direction:column;min-width:0}
body.g .rb{font-size:18px;margin:6px 0 0}body.g .score{margin:4px 0}
.bd{flex:1 1 auto;margin:4px 0}.bd+.mut{margin:2px 0 0}
.c{max-width:440px;margin:0 auto;min-height:60vh;display:flex;flex-direction:column;justify-content:center;text-align:center}.c .card{width:100%}.c input{text-align:center}
.lob{text-align:center;max-width:560px;margin-left:auto;margin-right:auto}
.qimg{display:block;max-width:100%;max-height:40vh;margin:8px auto;border-radius:10px;background:#fff}.qimg.in{animation:zoom .5s cubic-bezier(.2,1.3,.4,1)}.rb{margin:10px 0 0;text-align:center}.rb.in{animation:zoom .5s}
.win{text-align:center;font:700 22px Georgia,serif;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.dots::after{content:'';animation:dots 1.4s steps(1) infinite}
/* Animationen */
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes zoom{from{transform:scale(.4) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bump{40%{transform:scale(1.3);background:var(--gold);color:#222}}
@keyframes burn{from{background:var(--tile);color:#fff;transform:scale(1.15) rotate(3deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.step{animation:rise .35s ease-out}
.cat.in{animation:rise .5s backwards;animation-delay:calc(var(--d)*70ms)}
.tile.in{animation:pop .45s backwards;animation-delay:calc(300ms + var(--d)*55ms)}
.tile.burn{animation:burn .6s ease-out}
.chip.pop{animation:pop .4s}.chip.bump{animation:bump .6s}
.ov.in{animation:fade .25s}.ov.in .box{animation:zoom .45s cubic-bezier(.2,1.3,.4,1)}
.ans.in{animation:flip .5s}.turn.in{animation:pop .35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main><h1>МОЯК</h1><div id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sample=()=>[
{n:'Geografie',c:[['Hauptstadt von Australien?','Canberra'],['Längster Fluss Europas?','Wolga'],['Höchster Berg der Erde?','Mount Everest'],['Land mit den meisten Einwohnern?','Indien'],['Kleinster Kontinent?','Australien/Ozeanien']]},
{n:'Film & TV',c:[['Regisseur von „Titanic“?','James Cameron'],['Wie heißt der Zauberer mit Brille und Narbe?','Harry Potter'],['Fisch, der Nemo sucht?','Dorie'],['Kultiger Roboter aus „Star Wars“ (R2-…)?','D2'],['Serie über Walter White?','Breaking Bad']]},
{n:'Wissenschaft',c:[['Chemisches Symbol für Gold?','Au'],['Planet mit den Ringen?','Saturn'],['Wie viele Knochen hat ein Erwachsener (ca.)?','206'],['Lichtgeschwindigkeit in km/s (ca.)?','300.000'],['Wer entwickelte die Relativitätstheorie?','Albert Einstein']]}
].map(x=>({n:x.n,clues:x.c.map(y=>({q:y[0],a:y[1]}))}));
const mk=(n,c)=>({n,clues:c.map(y=>({q:y[0],a:y[1]}))});
const sample3=()=>[sample(),
[mk('Geschichte',[['In welchem Jahr fiel die Berliner Mauer?','1989'],['Wer betrat als Erster den Mond?','Neil Armstrong'],['Welches Volk baute die Pyramiden von Gizeh?','Die alten Ägypter'],['Wer entdeckte 1492 Amerika (für Spanien)?','Christoph Kolumbus'],['In welchem Jahr begann der Erste Weltkrieg?','1914']]),
 mk('Essen & Trinken',[['Aus welchem Land stammt die Pizza?','Italien'],['Hauptzutat von Guacamole?','Avocado'],['Aus Hopfen und Malz braut man …?','Bier'],['Aus welchem Land kommt Sushi?','Japan'],['Teuerstes Gewürz der Welt?','Safran']])],
[mk('Tiere',[['Größtes Landtier?','Afrikanischer Elefant'],['Wie viele Beine hat eine Spinne?','8'],['Schnellstes Landtier?','Gepard'],['Welches hüpfende Tier ist Wappentier Australiens?','Känguru'],['Welches Säugetier kann fliegen?','Fledermaus']])]];
let board=(()=>{try{const j=JSON.parse(localStorage.getItem('jp_board3'));if(Array.isArray(j)&&j.length===3)return j}catch(e){}try{const o=JSON.parse(localStorage.getItem('jp_board'));if(Array.isArray(o)&&o.length)return [o,[],[]]}catch(e){}return sample3()})();
const save=()=>{try{localStorage.setItem('jp_board3',JSON.stringify(board));return true}catch(e){return false}};
let view='home',role=null,name='',code='',R=null,S=null,msg='',busy=false,prev=null,lastJ='';
let er=0,G=[],curImg=null,imgC=null,imgAnim=null,curAImg=null,aimgC=null,aimgAnim=null;const has=q=>!!(q.q.trim()||q.img);
try{name=localStorage.getItem('jp_name')||''}catch(e){}
const go=v=>{view=v;msg='';render()};

function render(){
 const a=$('#app');document.body.classList.toggle('g',view==='game');a.className=['home','host-name','join-code','join-name'].includes(view)?'c':'';
 const err=`<p class="${busy?'mut':'err'}">${esc(msg)}</p>`;
 const nameField=`<label for="nm">Dein Name</label><input id="nm" maxlength="20" value="${esc(name)}" placeholder="z. B. Alex" autocomplete="nickname">`;
 const nav=(back,label)=>`<div class="row eq" style="margin-top:12px"><button class="alt" id="bk">← Zurück</button><button id="go" ${busy?'disabled':''}>${label}</button></div>`;
 if(view==='home'){
  a.innerHTML=`<div class="card step"><p class="mut">Spiele МОЯК mit Freunden: Einer erstellt die Lobby (Moderator), die anderen treten mit dem Code bei und buzzern.</p>
  <div class="stack"><button id="mk">Lobby erstellen</button><button id="jn">Lobby beitreten</button></div>
  </div>${err}`;
  $('#mk').onclick=()=>go('host-name');$('#jn').onclick=()=>go('join-code');
 }else if(view==='host-name'){
  a.innerHTML=`<div class="card step">${nameField}${nav('home','Weiter zu den Fragen')}</div>${err}`;
  $('#bk').onclick=()=>go('home');$('#go').onclick=()=>{name=$('#nm').value.trim().slice(0,20);if(!name){msg='Bitte gib einen Namen ein.';return render()}try{localStorage.setItem('jp_name',name)}catch(e){}go('edit')};
 }else if(view==='join-code'){
  a.innerHTML=`<div class="card step"><label for="cd">Lobby-Code</label><input id="cd" maxlength="5" value="${esc(code.toUpperCase())}" placeholder="z. B. K7P2X" style="text-transform:uppercase" autocomplete="off">${nav('home','Weiter')}</div>${err}`;
  $('#bk').onclick=()=>go('home');
  $('#go').onclick=()=>{const c=$('#cd').value.trim().toLowerCase();code=c;if(!/^[a-z0-9]{5}$/.test(c)){msg='Bitte einen gültigen 5-stelligen Code eingeben.';return render()}go('join-name')};
 }else if(view==='join-name'){
  a.innerHTML=`<div class="card step"><p>Lobby <span class="code">${esc(code.toUpperCase())}</span></p>${nameField}${nav('join-code','Beitreten')}</div>${err}`;
  $('#bk').onclick=()=>go('join-code');$('#go').onclick=()=>start('player');
 }else if(view==='edit')return renderEdit();
 else return renderGame();
 const inp=$('input');if(inp){inp.onkeydown=e=>{if(e.key==='Enter')$('#go').click()};if(!busy)inp.focus()}
}
function renderEdit(){
 const rd=board[er],ij=s=>{const a=s.split('.');return [+a[0],+a[1],a[2]]},
 im=(i,j,k,q,t)=>`<span class="imc">${q[k]?`<img class="th" src="${esc(q[k])}" alt=""><button class="bad" data-rm="${i}.${j}.${k}">✕</button>`:''}<label class="imb" title="Bild ${t}">🖼 ${t}<input type="file" accept="image/*" hidden data-img="${i}.${j}.${k}"></label></span>`;
 $('#app').innerHTML=`<div class="row eq"><button class="alt" id="bk">← Zurück</button><button class="gold" id="mkb" ${busy?'disabled':''}>Lobby erstellen</button></div>
 <div class="row eq tabs" style="margin-top:10px">${[0,1,2].map(i=>`<button class="${i===er?'':'alt'}" data-tab="${i}">Runde ${i+1}</button>`).join('')}</div>
 <div class="row eq" style="margin-top:10px"><button class="alt" id="ac" ${rd.length>=6?'disabled':''}>+ Kategorie</button><button class="alt" id="rs">Beispiel laden</button></div>
 <p class="mut">Hallo ${esc(name)}! Pro Kategorie bis zu 5 Fragen, in Runde ${er+1} zählen sie ×${er+1}. Zu Frage und Antwort kannst du je ein Bild hinzufügen (🖼); das Antwortbild erscheint erst bei „Antwort zeigen“. Leere Felder und leere Runden werden übersprungen. Alles wird in diesem Browser gespeichert.</p><p class="${busy?'mut':'err'}">${esc(msg)}</p>`+
 rd.map((c,i)=>`<div class="card ed"><div class="row"><input data-i="${i}" data-f="n" value="${esc(c.n)}" placeholder="Kategorie ${i+1}"><button class="bad" data-del="${i}" style="flex:0 0 auto">Löschen</button></div>`+
 c.clues.map((q,j)=>`<div class="r"><b>${(j+1)*100*(er+1)}</b><input data-i="${i}" data-j="${j}" data-f="q" value="${esc(q.q)}" placeholder="Frage"><input data-i="${i}" data-j="${j}" data-f="a" value="${esc(q.a)}" placeholder="Antwort"></div><div class="r" style="padding-left:60px">${im(i,j,'img',q,'Frage')}${im(i,j,'aimg',q,'Antwort')}</div>`).join('')+`</div>`).join('');
 $('#bk').onclick=()=>go('host-name');
 $('#mkb').onclick=()=>start('host');
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{er=+b.dataset.tab;msg='';render()});
 $('#ac').onclick=()=>{rd.push({n:'',clues:[0,1,2,3,4].map(()=>({q:'',a:''}))});save();render()};
 $('#rs').onclick=()=>{board=sample3();save();render()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{rd.splice(+b.dataset.del,1);save();render()});
 document.querySelectorAll('input[data-f]').forEach(inp=>inp.oninput=()=>{const c=rd[+inp.dataset.i];if(inp.dataset.f==='n')c.n=inp.value;else c.clues[+inp.dataset.j][inp.dataset.f]=inp.value;save()});
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const [i,j,k]=ij(b.dataset.rm);delete rd[i].clues[j][k];save();render()});
 document.querySelectorAll('[data-img]').forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;const [i,j,k]=ij(inp.dataset.img);
  shrink(f,d=>{const q=rd[i].clues[j],o=q[k];if(!d)msg='Das Bild konnte nicht gelesen werden.';else{q[k]=d;if(save())msg='';else{q[k]=o;msg='Speicher voll: Entferne andere Bilder oder nimm ein kleineres.'}}render()})});
}
function shrink(f,cb){
 const fr=new FileReader();fr.onerror=()=>cb(null);
 fr.onload=()=>{const im=new Image();im.onerror=()=>cb(null);
  im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
   const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};
  im.src=fr.result};
 fr.readAsDataURL(f);
}
function renderGame(){
 const host=role==='host',s=S,pv=prev;
 let h=`<div class="top"><span class="mut">Code</span><span class="code">${esc(code.toUpperCase())}</span><button class="alt" id="lv">Verlassen</button></div>`;
 if(!s)h+=`<p class="mut">Verbinde mit der Lobby<span class="dots"></span></p>`;
 else if(s.phase==='lobby')h+=lobbyHtml(s,host,pv);
 else h+=boardHtml(s,host,pv);
 $('#app').innerHTML=h;
 $('#lv').onclick=()=>leave();
 const g=id=>$(id);
 if(g('#st'))g('#st').onclick=()=>{S.phase='board';push()};
 if(g('#nx'))g('#nx').onclick=()=>{loadRound(S.ri+1);push()};
 document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>pick(+b.dataset.c,+b.dataset.r));
 if(g('#jy'))g('#jy').onclick=()=>judge(true);
 if(g('#jn2'))g('#jn2').onclick=()=>judge(false);
 if(g('#rv'))g('#rv').onclick=reveal;
 if(g('#sk'))g('#sk').onclick=finish;
 if(g('#bz'))g('#bz').onclick=()=>{g('#bz').disabled=true;R.send({t:'buzz',cid:S.cid})};
 prev=s?JSON.parse(JSON.stringify(s)):null;
}
function lobbyHtml(s,host,pv){
 const names=Object.keys(s.scores);
 return `<div class="card step lob" style="margin-top:14px"><h2>Wartezimmer</h2>
 <p class="mut">Moderator: <b>${esc(s.host)}</b>. Teile den Code, damit die anderen beitreten können.</p>
 <div class="score">${names.map(n=>`<span class="chip${pv&&pv.phase==='lobby'&&n in pv.scores?'':' pop'}">${esc(n)}${n===name&&!host?' (du)':''}</span>`).join('')||'<span class="mut">Noch niemand da …</span>'}</div>
 <p class="mut">${s.rn===1?'1 Runde':s.rn+' Runden'}. Kategorien in Runde 1: ${s.cats.map(esc).join(', ')}</p>
 ${host?`<button class="gold" id="st" style="width:100%" ${names.length?'':'disabled'}>Spiel starten (${names.length} Spieler)</button>`:`<p class="mut">Warte auf den Moderator<span class="dots"></span></p>`}</div>`;
}
function boardHtml(s,host,pv){
 const n=s.cats.length,cur=s.clue,fresh=!pv||pv.phase==='lobby'||pv.ri!==s.ri,open=s.used.flat().filter(x=>!x).length;
 let h=`<h2 class="rb${fresh?' in':''}">Runde ${s.ri+1} von ${s.rn}${s.mult>1?` (Punkte ×${s.mult})`:''}</h2><div class="score">${Object.keys(s.scores).map(nm=>{const o=pv&&pv.scores[nm];const k=o===undefined?' pop':o!==s.scores[nm]?' bump':'';return `<span class="chip${k}">${esc(nm)}${nm===name&&!host?' (du)':''}: <b>${s.scores[nm]}</b></span>`}).join('')}</div>`;
 h+=`<div class="grid bd" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:auto repeat(5,minmax(56px,1fr))">`+s.cats.map((c,i)=>`<div class="cat${fresh?' in':''}" style="--d:${i}">${esc(c)}</div>`).join('');
 for(let r=0;r<5;r++)for(let c=0;c<n;c++){
  const used=s.used[c][r],burn=used&&pv&&pv.ri===s.ri&&pv.used[c]&&pv.used[c][r]===0;
  h+=`<button class="tile${used?' used':''}${fresh&&!used?' in':''}${burn?' burn':''}" style="--d:${c+r}" data-c="${c}" data-r="${r}" ${(!host||used||s.phase!=='board')?'disabled':''}>${used?'':(r+1)*100*s.mult}</button>`;
 }
 h+=`</div>`;
 if(open)h+=`<p class="mut">${open===1?'Noch 1 Frage offen':`Noch ${open} Fragen offen`}.${host&&s.phase==='board'?' Wähle ein Feld, lies die Frage vor und beurteile die Antworten.':''}</p>`;
 else if(s.phase==='board'){
  if(s.ri<s.rn-1)h+=`<div class="card win">Runde ${s.ri+1} geschafft!<br>${host?`<button class="gold" id="nx" style="margin-top:10px">Weiter zu Runde ${s.ri+2}</button>`:`<span class="mut">Warte auf den Moderator<span class="dots"></span></span>`}</div>`;
  else{
   const top=Object.entries(s.scores).sort((a,b)=>b[1]-a[1]),best=top.length?top[0][1]:0,w=top.filter(x=>x[1]===best).map(x=>x[0]);
   h+=`<div class="card win">🏆 Spiel vorbei!${w.length?`<br>${w.length>1?'Gewinner':'Gewinner/in'}: ${esc(w.join(' & '))} (${best})`:''}</div>`;
  }
 }
 if(s.phase==='clue'&&cur){
  const who=s.queue.find(x=>!s.tried.includes(x));
  const isNew=!pv||pv.phase!=='clue'||pv.cid!==s.cid;
  const pwho=pv&&pv.queue?pv.queue.find(x=>!pv.tried.includes(x)):null;
  h+=`<div class="ov${isNew?' in':''}"><div class="box"><div>${esc(s.cats[cur.c])} für ${cur.v}</div><div class="q">${esc(cur.q)}</div>`;
  if(cur.img&&!(s.ans!=null&&cur.aimg)){
   const im=host?curImg:(imgC&&imgC.cid===s.cid?imgC.d:null);
   if(im){const an=imgAnim!==s.cid;imgAnim=s.cid;h+=`<img class="qimg${an?' in':''}" src="${esc(im)}" alt="">`}
   else h+=`<p style="color:#dfe3ff">Bild wird geladen<span class="dots"></span></p>`;
  }
  if(s.ans!=null){
   h+=`<div class="ans${!isNew&&pv.ans==null?' in':''}">Antwort: ${esc(s.ans)}</div>`;
   if(cur.aimg){const a=host?curAImg:(aimgC&&aimgC.cid===s.cid?aimgC.d:null);
    if(a){const an=aimgAnim!==s.cid;aimgAnim=s.cid;h+=`<img class="qimg${an?' in':''}" src="${esc(a)}" alt="">`}
    else h+=`<p style="color:#dfe3ff">Bild wird geladen<span class="dots"></span></p>`;}
  }
  if(who)h+=`<p class="turn${!isNew&&pwho!==who?' in':''}"><b>${esc(who)}</b> ist dran!</p>`;else h+=`<p>${s.ans!=null?'':'Buzzer offen …'}</p>`;
  if(host){
   const ca=(((G[s.ri]||[])[cur.c]||{}).clues||[])[cur.r];
   h+=`<div class="hostans">Nur für dich: ${esc(ca?ca.a:'')}</div><div class="row eq" style="margin-top:12px"><button class="ok" id="jy" ${who?'':'disabled'}>Richtig</button><button class="bad" id="jn2" ${who?'':'disabled'}>Falsch</button><button class="gold" id="rv" ${s.ans!=null?'disabled':''}>Antwort zeigen</button><button class="alt" id="sk" style="color:#fff">Beenden</button></div>`;
  }else{
   const mine=s.tried.includes(name),queued=s.queue.includes(name),off=mine||queued||s.ans!=null;
   h+=`<button class="buzz" id="bz" ${off?'disabled':''}>${mine?'Gesperrt':queued?'Gebuzzert ✓':s.ans!=null?'Vorbei':'BUZZ!'}</button>`;
  }
  h+=`</div></div>`;
 }
 return h;
}
let P=null,conns=[],hb=null;
function start(r){
 if(r!=='host')name=$('#nm').value.trim().slice(0,20);
 if(!name){msg='Bitte gib einen Namen ein.';return render()}
 try{localStorage.setItem('jp_name',name)}catch(e){}
 if(typeof Peer==='undefined'){msg='PeerJS konnte nicht geladen werden (Internetverbindung prüfen).';return render()}
 if(r==='host'){G=board.map(x=>x.filter(c=>c.clues.some(has))).filter(x=>x.length);if(!G.length){msg='Bitte zuerst mindestens eine Frage anlegen.';return render()}}
 busy=true;msg='Verbinde …';render();
 if(r==='host')hostInit(0);else joinInit();
}
function hostInit(t){
 code=Array.from({length:5},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
 const p=P=new Peer('jpd-'+code);
 p.on('error',e=>{if(P!==p)return;if(e.type==='unavailable-id'&&t<5){P=null;p.destroy();return hostInit(t+1)}leave('edit','Verbindungsfehler: '+e.type)});
 p.on('open',()=>{
  S={host:name,ri:0,rn:G.length,mult:1,cats:[],used:[],phase:'lobby',clue:null,ans:null,queue:[],tried:[],scores:{},cid:0};loadRound(0);
  role='host';view='game';busy=false;msg='';prev=null;render();
  hb=setInterval(()=>push(true),3000);
 });
 p.on('connection',c=>{
  conns.push(c);
  c.on('data',d=>onMsg(c,d));
  c.on('close',()=>{
   conns=conns.filter(x=>x!==c);
   if(!S||!c.pn)return;
   if(S.phase==='lobby')delete S.scores[c.pn];
   S.queue=S.queue.filter(x=>x!==c.pn);
   push();
  });
 });
}
function joinInit(){
 const p=P=new Peer();
 p.on('error',e=>{if(P!==p)return;e.type==='peer-unavailable'?leave('join-code','Lobby nicht gefunden. Bitte den Code prüfen.'):leave('join-name','Verbindungsfehler: '+e.type)});
 p.on('open',()=>{
  const c=R=p.connect('jpd-'+code,{reliable:true});
  c.on('open',()=>{role='player';view='game';busy=false;S=null;lastJ='';prev=null;msg='';c.send({t:'hello',name});render()});
  c.on('data',d=>{
   if(!d)return;
   if(d.t==='img'){imgC={cid:d.cid,d:d.d};if(S&&S.cid===d.cid)render();return}
   if(d.t==='aimg'){aimgC={cid:d.cid,d:d.d};if(S&&S.cid===d.cid)render();return}
   if(d.t==='dup')return leave('join-name','Dieser Name ist in der Lobby schon vergeben.');
   if(d.t==='state'){const j=JSON.stringify(d.s);if(j===lastJ)return;lastJ=j;S=d.s;render()}
  });
  c.on('close',()=>{if(P===p)leave('home','Verbindung zur Lobby getrennt.')});
 });
}
function onMsg(c,d){
 if(!d||!S)return;
 if(d.t==='hello'&&typeof d.name==='string'&&d.name.trim()){
  const nm=d.name.trim().slice(0,20),l=nm.toLowerCase();
  if(l===S.host.toLowerCase()||conns.some(x=>x!==c&&x.pn&&x.pn.toLowerCase()===l)){try{c.send({t:'dup'})}catch(e){}setTimeout(()=>c.close(),400);return}
  c.pn=nm;
  if(!(nm in S.scores))S.scores[nm]=0;
  if(S.phase==='clue'&&curImg)try{c.send({t:'img',cid:S.cid,d:curImg})}catch(e){}
  if(S.phase==='clue'&&S.ans!=null&&curAImg)try{c.send({t:'aimg',cid:S.cid,d:curAImg})}catch(e){}
  push();
 }else if(d.t==='buzz'&&c.pn&&S.phase==='clue'&&S.ans==null&&d.cid===S.cid&&!S.queue.includes(c.pn)){
  S.queue.push(c.pn);push();
 }
}
function push(quiet){const m={t:'state',s:S};conns.forEach(c=>{try{c.open&&c.pn&&c.send(m)}catch(e){}});if(!quiet)render()}
function pick(c,r){
 if(!S||S.phase!=='board'||S.used[c][r])return;
 const q=G[S.ri][c].clues[r];curImg=q.img||null;curAImg=q.aimg||null;
 S.phase='clue';S.cid=Date.now();S.clue={c,r,v:(r+1)*100*S.mult,q:q.q.slice(0,600),img:!!curImg,aimg:!!curAImg};S.queue=[];S.tried=[];S.ans=null;
 if(curImg)conns.forEach(x=>{try{x.pn&&x.send({t:'img',cid:S.cid,d:curImg})}catch(e){}});
 push();
}
function loadRound(i){S.ri=i;S.mult=i+1;S.cats=G[i].map(c=>(c.n.trim()||'?').slice(0,30));S.used=G[i].map(c=>c.clues.map(q=>has(q)?0:1))}
function reveal(){const c=S.clue;S.ans=(G[S.ri][c.c].clues[c.r].a||'').slice(0,300);if(curAImg)conns.forEach(x=>{try{x.pn&&x.send({t:'aimg',cid:S.cid,d:curAImg})}catch(e){}});push()}
function judge(ok){
 const who=S.queue.find(x=>!S.tried.includes(x));if(!who)return;
 S.scores[who]=(S.scores[who]||0)+(ok?S.clue.v:-S.clue.v);
 if(ok)return finish();
 S.tried.push(who);push();
}
function finish(){curImg=curAImg=null;S.used[S.clue.c][S.clue.r]=1;S.phase='board';S.clue=null;S.ans=null;S.queue=[];S.tried=[];push()}
function leave(next,m){clearInterval(hb);const p=P;P=null;R=null;conns=[];S=null;prev=null;lastJ='';curImg=curAImg=imgC=aimgC=imgAnim=aimgAnim=null;role=null;busy=false;view=next||'home';msg=m||'';try{p&&p.destroy()}catch(e){}render()}
render();
</script>
